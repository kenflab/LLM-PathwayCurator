name: CI

on:
  pull_request:
    paths:
      - "src/llm_pathway_curator/**"
      - "tests/**"
      - "paper/revision/CRM_R1/**"
      - "paper/scripts/**"
      - "examples/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/ci.yml"
  push:
    branches: ["main"]
    paths:
      - "src/llm_pathway_curator/**"
      - "tests/**"
      - "paper/revision/CRM_R1/**"
      - "paper/scripts/**"
      - "examples/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/ci.yml"

jobs:
  tcga-input-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install limma
        shell: Rscript {0}
        run: |
          install.packages("BiocManager")
          BiocManager::install("limma", ask = FALSE, update = FALSE)
      - name: Test TCGA gene identity and group contracts
        run: Rscript tests/test_tcga_inputs.R

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests paper/revision/CRM_R1/experiments/reassessment paper/revision/CRM_R1/tests/test_tool_reassessment.py
          ruff format --check src tests paper/revision/CRM_R1/experiments/reassessment paper/revision/CRM_R1/tests/test_tool_reassessment.py

      - name: Import smoke
        run: python -c "import llm_pathway_curator; print('import ok')"

      - name: Pytest
        run: pytest -q

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: python -m pip install -U pip
      - run: python -m pip install -U build twine
      - run: python -m build
      - run: python -m twine check dist/*
